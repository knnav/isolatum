[package]
name = "hush"
version = "0.1.0"
description = "A white noise machine"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash between the lib and bin targets on Windows.
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
# Small binary for a small app.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
